[project]
name = "gaussian-cbo-reproduction"
version = "0.1.0"
description = "Reproducible verification campaign for arXiv:2601.00632"
requires-python = ">=3.12,<3.13"
dependencies = [
  "huggingface-hub>=0.34,<2",
  "ipykernel>=6.29,<8",
  "marimo>=0.15,<1",
  "matplotlib>=3.9,<4",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "numpy>=2.0,<3",
  "psutil>=6,<8",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["repro/tests"]
